name: Android CI

# Triggers the workflow on push or pull request events for the main branch
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repository source code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Set up Java Development Kit (JDK 17 or 21 depending on your AGP)
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle' # Automatically caches Gradle dependencies to speed up builds

      # Step 3: Validate the Gradle Wrapper to prevent security vulnerabilities
      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v3

      # Step 4: Grant execute permission for the Gradle Wrapper script
      - name: Make Gradlew Executable
        run: chmod +x gradlew

      # Step 5: Run Android Lint to perform static code analysis
      - name: Run Code Linting
        run: ./gradlew lintDebug

      # Step 6: Execute local JUnit unit tests
      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

      # Step 7: Build the Debug APK to guarantee compilation success
      - name: Build Debug APK
        run: ./gradlew assembleDebug

      # Step 8: Upload the generated APK as a downloadable GitHub artifact
      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          
