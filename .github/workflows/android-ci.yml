name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Licenses & Install Android SDK 36
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools" || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Setup Environment & Secrets
        run: |
          # 1. Create .env and local.properties
          touch .env
          echo "MAPS_API_KEY=${{ secrets.MAPS_API_KEY }}" >> .env
          touch .env.example
          
          touch local.properties
          echo "sdk.dir=$ANDROID_HOME" >> local.properties
          echo "MAPS_API_KEY=${{ secrets.MAPS_API_KEY }}" >> local.properties
          
          # 2. Google Services JSON
          if [ -f "google-services.json" ]; then
            cp google-services.json app/google-services.json || true
          fi

      - name: Decode Keystore
        run: |
          # Decode Release Key if provided in Secrets
          if [ -n "${{ secrets.SIGNING_KEY }}" ]; then
            echo "${{ secrets.SIGNING_KEY }}" | base64 --decode > app/release-key.jks
            echo "KEYSTORE_PATH=app/release-key.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=${{ secrets.KEY_STORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ secrets.ALIAS }}" >> $GITHUB_ENV
          fi

          # Setup debug keystore for debug builds
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          else
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore || true
          cp debug.keystore app/debug.keystore || true

      - name: Build APK with Gradle
        env:
          JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true -Xmx4096m"
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m"
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AttendanceApp-Debug-APK
          path: app/build/outputs/apk/**/*.apk
          retention-days: 14

      - name: Create or Update GitHub Release
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Attendance App v1.0.${{ github.run_number }}
          body: |
            ## Attendance & Payroll App (Haazri Pro) 📱
            - ✅ Automated build completed successfully.
            - 📥 Download `app-debug.apk` below to install directly on your Android phone.
          files: app/build/outputs/apk/**/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
