name: Build & Release APK & AAB (Both)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release APK and AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 'wrapper'

      - name: Setup Keystores & Environment
        run: |
          echo "=== Setup Keystores ==="
          if [ ! -f "./debug.keystore" ]; then
            keytool -genkey -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore || true
          cp debug.keystore app/debug.keystore || true

          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > ./release.keystore
            echo "Decoded RELEASE_KEYSTORE_BASE64 secret into release.keystore"
          elif [ -f "./release.keystore.base64" ]; then
            base64 --decode ./release.keystore.base64 > ./release.keystore
            echo "Decoded release.keystore.base64 file into release.keystore"
          elif [ -f "./release.keystore" ]; then
            echo "Existing release.keystore found."
          else
            echo "Generating default release.keystore..."
            keytool -genkey -v \
              -keystore ./release.keystore \
              -storepass androidrelease \
              -alias releasekey \
              -keypass androidrelease \
              -dname "CN=Android Release,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi
          cp release.keystore app/release.keystore || true

      - name: Build Release & Debug APK & AAB
        env:
          JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true -Xmx2048m"
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m"
        run: |
          chmod +x gradlew
          echo "=== Building Release APK & AAB ==="
          ./gradlew :app:assembleRelease :app:bundleRelease --stacktrace --no-daemon

          echo "=== Building Debug APK & AAB ==="
          ./gradlew :app:assembleDebug :app:bundleDebug --stacktrace --no-daemon

      - name: Verify APK and AAB Output
        run: |
          echo "=== Verifying Build Outputs ==="
          if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            APK_PATH="app/build/outputs/apk/release/app-release.apk"
          else
            APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          fi

          if [ -f "app/build/outputs/bundle/release/app-release.aab" ]; then
            AAB_PATH="app/build/outputs/bundle/release/app-release.aab"
          else
            AAB_PATH="app/build/outputs/bundle/debug/app-debug.aab"
          fi

          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: APK not found!" >&2
            exit 1
          fi

          if [ ! -f "$AAB_PATH" ]; then
            echo "ERROR: AAB not found!" >&2
            exit 1
          fi

          echo "APK Verified: $APK_PATH"
          echo "AAB Verified: $AAB_PATH"

      - name: Upload Artifacts (APK & AAB)
        uses: actions/upload-artifact@v4
        with:
          name: app-apk-and-aab-bundle
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/bundle/debug/app-debug.aab
          if-no-files-found: warn
          retention-days: 14

      - name: Prepare Release Assets
        id: prepare_assets
        run: |
          TEMP_DIR=$(mktemp -d)
          
          REPO_RAW="${GITHUB_REPOSITORY#*/}"
          REPO_CLEAN=$(echo "$REPO_RAW" | tr '[:upper:]' '[:lower:]' | tr -cs 'a-z0-9' '-' | sed 's/^-//;s/-$//')
          if [ -z "$REPO_CLEAN" ]; then
            REPO_CLEAN="app"
          fi

          if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            cp "app/build/outputs/apk/release/app-release.apk" "${TEMP_DIR}/${REPO_CLEAN}-release-${GITHUB_RUN_NUMBER}.apk"
          else
            cp "app/build/outputs/apk/debug/app-debug.apk" "${TEMP_DIR}/${REPO_CLEAN}-debug-${GITHUB_RUN_NUMBER}.apk"
          fi

          if [ -f "app/build/outputs/bundle/release/app-release.aab" ]; then
            cp "app/build/outputs/bundle/release/app-release.aab" "${TEMP_DIR}/${REPO_CLEAN}-release-${GITHUB_RUN_NUMBER}.aab"
          else
            cp "app/build/outputs/bundle/debug/app-debug.aab" "${TEMP_DIR}/${REPO_CLEAN}-debug-${GITHUB_RUN_NUMBER}.aab"
          fi

          APK_FILE=$(ls "${TEMP_DIR}"/*.apk | head -n 1)
          AAB_FILE=$(ls "${TEMP_DIR}"/*.aab | head -n 1)

          echo "apk_path=$APK_FILE" >> "$GITHUB_OUTPUT"
          echo "aab_path=$AAB_FILE" >> "$GITHUB_OUTPUT"
          echo "apk_name=$(basename "$APK_FILE")" >> "$GITHUB_OUTPUT"
          echo "aab_name=$(basename "$AAB_FILE")" >> "$GITHUB_OUTPUT"

      - name: Publish Both APK and AAB to GitHub Releases
        id: create_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK_PATH="${{ steps.prepare_assets.outputs.apk_path }}"
          AAB_PATH="${{ steps.prepare_assets.outputs.aab_path }}"
          
          RELEASE_TAG="apk-aab-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="App Build #${GITHUB_RUN_NUMBER} (APK & AAB Release)"

          NOTES=$(cat <<EOF
          ## Android App Build #${GITHUB_RUN_NUMBER} (Both APK & AAB) 📱📦

          This release includes **both** file formats generated automatically by GitHub Actions:
          - 📱 **Android App (APK):** Ready for direct installation & testing on your Android phone.
          - 📦 **Android App Bundle (AAB):** Ready for Google Play Console upload.

          - **Build System:** GitHub Actions
          - **Commit:** ${GITHUB_SHA}
          EOF
          )

          gh release create "$RELEASE_TAG" "$APK_PATH" "$AAB_PATH" \
            --title "$RELEASE_TITLE" \
            --notes "$NOTES" \
            --target "$GITHUB_SHA" \
            --latest
